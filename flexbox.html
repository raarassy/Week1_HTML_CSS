<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Profile Card - Raras</title>
  <link rel="stylesheet" href="flexbox.css">
</head>
<body>

<div class="container">
    <div>Item 1</div>
    <div>Item 2</div>
    <div>Item 3</div>
</div>

<div class="profil">
    <div>Home</div>
    <div>About</div>
    <div>Contact</div>
</div>

<div class="nama">
    <div>Buah</div>
    <div>Hewan</div>
    <div>Kota</div>
</div>

<div class="kategori">
    <div>Kampus</div>
    <div>Fakultas</div>
    <div>Prodi</div>
</div>

<div class="cards">
    <div class="card">
        <h3>Card 1</h3>
        <p>Ini isi card pertama.</p>
    </div>

    <div class="card">
        <h3>Card 2</h3>
        <p>Ini isi card kedua.</p>
    </div>

    <div class="card">
        <h3>Card 3</h3>
        <p>Ini isi card ketiga.</p>
    </div>
</div>
